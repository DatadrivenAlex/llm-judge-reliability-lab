[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge-reliability-lab"
version = "0.1.0"
description = "Offline audit for pairwise LLM-judge accuracy, order bias, and confidence calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alexandru Cojocari"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
judge-audit = "judge_lab.cli:main"

[tool.setuptools.packages.find]
include = ["judge_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py311"
